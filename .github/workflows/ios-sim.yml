# GENESYS web app per iPhone: prova automatica sul simulatore iPhone (macOS gratuito di GitHub, repository pubblico).
# Safari apre la copia di prova del sito, aggiunge GENESYS alla schermata Home, la apre come app e la lascia lavorare:
# accesso di prova, salto fuori/dentro, installazione di 7TH DAY cifrato, avvio, ritorno. Foto nella cassaforte privata.
name: ios-sim
on:
  push:
    branches: [ios-ci]
permissions:
  contents: write
concurrency:
  group: ios-sim
  cancel-in-progress: true
jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Simulatore iPhone
        run: bash ios/run.sh 2>&1 | tee ci-log.txt; exit ${PIPESTATUS[0]}
      - name: Log
        if: always()
        run: bash ci/log.sh
