# GENESYS for Android: build, signing and publishing on GitHub's free runners (public repository: no cost).
# Runs only on the android-ci branch. Sources and the signing key travel encrypted; the key that opens them is kept
# in a draft release that only the repository owner can see.
name: android-ci
on:
  push:
    branches: [android-ci]
permissions:
  contents: write
concurrency:
  group: android-ci
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Kind
        id: kind
        run: echo "kind=$(jq -r .kind ci/job.json)" >> "$GITHUB_OUTPUT"
      - name: Job
        run: bash ci/run.sh 2>&1 | tee ci-log.txt; exit ${PIPESTATUS[0]}
      - name: KVM
        if: steps.kind.outputs.kind == 'test'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        if: steps.kind.outputs.kind == 'test'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emu.sh 2>&1 | tee -a ci-log.txt
      - name: Log
        if: always()
        run: bash ci/log.sh
