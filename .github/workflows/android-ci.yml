# GENESYS for Android: build, signing and publishing on GitHub's free runners (public repository: no cost).
# Runs only on the android-ci branch. Sources and the signing key travel encrypted; the key that opens them is kept
# in a draft release that only the repository owner can see.
name: android-ci
on:
  push:
    branches: [android-ci]
permissions:
  contents: write
concurrency:
  group: android-ci
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Job
        run: bash ci/run.sh 2>&1 | tee ci-log.txt; exit ${PIPESTATUS[0]}
      - name: Log
        if: always()
        run: bash ci/log.sh
